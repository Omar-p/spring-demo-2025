services:
  postgres:
    container_name: 'postgres'
    image: 'postgres:17.5'
    environment:
      - 'POSTGRES_DB=customers'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5432:5432'
  prometheus:
    container_name: 'prometheus'
    image: 'prom/prometheus:v3.5.0'
    restart: always
    ports:
      - '9090:9090'
    command:
        - '--config.file=/etc/prometheus/prometheus.yaml'
    volumes:
      - './docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml'
  grafana:
    container_name: 'grafana'
    image: 'grafana/grafana:12.2.0-16636675413'
    ports:
      - '3000:3000'
  otel-collector:
    container_name: opentelemetry-collector
    restart: always

    image: otel/opentelemetry-collector-contrib:0.131.1
    command:
      - '--config=/etc/otelcol-contrib/otel-collector.yaml'
    volumes:
      - ./docker/collector/otel-collector.yaml:/etc/otelcol-contrib/otel-collector.yaml
    ports:
      - '1888:1888' # pprof extension
      - '8888:8888' # Prometheus metrics exposed by the Collector
      - '8889:8889' # Prometheus exporter metrics
      - '13133:13133' # health_check extension
      - '4317:4317' # OTLP gRPC receiver
      - '4318:4318' # OTLP http receiver
      - '55679:55679' # zpages extension
